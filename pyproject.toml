[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "looplane"
version = "0.1.0"
description = "A Python-first coding agent that produces verified patches in disposable workspaces."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Vincent Xu", email = "innocent0705@gmail.com" }]
keywords = ["coding-agent", "ai", "cli", "developer-tools", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Typing :: Typed",
]

dependencies = [
  "httpx>=0.28.0",
  "openai>=1.68.0",
  "pydantic>=2.10.0",
  "textual>=8.2.8,<9",
  "typer>=0.15.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "import-linter>=2.1",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
  "websockets>=15.0.0",
]
sandbox = [
  "pytest==8.4.2",
  "pytest-asyncio==1.4.0",
]
web = [
  "trafilatura>=2.0.0",
  "duckduckgo-search>=7.0.0",
]
media = [
  "Pillow>=11.0.0",
  "playwright>=1.49.0",
]
all = [
  "looplane[web,media]",
]

[project.scripts]
looplane = "looplane.cli:app"

[project.urls]
Homepage = "https://github.com/lanefoundry/looplane"
Repository = "https://github.com/lanefoundry/looplane"
Issues = "https://github.com/lanefoundry/looplane/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/looplane"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/looplane",
  "/tests",
  "/scripts",
  "/evals/fixtures",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/.git", "**/.venv", "**/node_modules"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
# Historical source snapshots are evidence, not the current lint target.
extend-exclude = [".research/*-frozen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# --- Module boundary enforcement ---

[tool.importlinter]
root_packages = ["looplane"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "runner-does-not-directly-import-domain-loaders"
type = "forbidden"
source_modules = ["looplane.agent.runner"]
forbidden_modules = [
  "looplane.skills",
  "looplane.instructions",
  "looplane.plugins",
  "looplane.memory",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "tooling-definitions-stays-pure"
type = "forbidden"
source_modules = ["looplane.tooling.definitions"]
forbidden_modules = [
  "looplane.skills",
  "looplane.agent",
  "looplane.prompts",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "skill-dispatch-does-not-import-runner"
type = "forbidden"
source_modules = ["looplane.agent.skill_dispatch"]
forbidden_modules = [
  "looplane.agent.runner",
  "looplane.agent.context",
  "looplane.tooling.executor",
]
allow_indirect_imports = true
