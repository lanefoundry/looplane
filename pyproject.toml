[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rivumi"
version = "0.1.0"
description = "A Python-first coding agent that produces verified patches in disposable workspaces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "openai>=1.68.0",
  "pydantic>=2.10.0",
  "textual>=8.2.8,<9",
  "typer>=0.15.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
  "websockets>=15.0.0",
]
sandbox = [
  "pytest==8.4.2",
  "pytest-asyncio==1.4.0",
]

[project.scripts]
rivumi = "rivumi.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rivumi"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
