[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiny-python-bug"
version = "0.0.1"
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_python_bug"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
